<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Upscaler</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#667085; --line:#d9dde3; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1f25; --fg:#e7eaee; --muted:#98a2b3; --line:#2c333b; --accent:#5b8dff; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:880px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:26px; }
  .muted { color:var(--muted); }
  #drop { margin:24px 0; border:2px dashed var(--line); border-radius:12px; background:var(--card);
          padding:48px 16px; text-align:center; cursor:pointer; transition:border-color .15s; }
  #drop.over { border-color:var(--accent); }
  .opts { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .opts label { display:flex; gap:6px; align-items:center; }
  input[type=number] { width:80px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  .item { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:10px; margin-top:10px; }
  .item img { width:64px; height:64px; object-fit:cover; border-radius:6px; }
  .item .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  a.btn { background:var(--accent); color:#fff; padding:6px 12px; border-radius:6px; text-decoration:none; }
  .err { color:#d92d20; }
</style>
</head>
<body>
<main>
  <h1>AI Upscaler ×4</h1>
  <div class="muted">Real-ESRGAN x4plus · <span id="device">…</span></div>

  <div id="drop">Kéo thả ảnh vào đây hoặc bấm để chọn (PNG / JPG / WEBP, nhiều ảnh cùng lúc)
    <input id="file" type="file" accept="image/*" multiple hidden>
  </div>

  <div class="opts">
    <label>DPI <input id="dpi" type="number" value="300" min="72" max="1200"></label>
    <label>Tile <input id="tile" type="number" value="512" min="64" max="2048" step="64"></label>
    <span class="muted">Giảm tile nếu thiếu VRAM.</span>
  </div>

  <div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
fetch('/api/info').then(r => r.json()).then(d => $('#device').textContent = d.device);

const drop = $('#drop'), input = $('#file');
drop.onclick = () => input.click();
input.onchange = () => enqueue(input.files);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); enqueue(e.dataTransfer.files); };

let queue = Promise.resolve();
function enqueue(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<img src="${URL.createObjectURL(f)}"><div class="name"></div><span class="status muted">Đang chờ…</span>`;
    row.querySelector('.name').textContent = f.name;
    $('#list').prepend(row);
    queue = queue.then(() => run(f, row));
  }
  input.value = '';
}

async function run(f, row) {
  const status = row.querySelector('.status');
  status.textContent = 'Đang upscale…';
  const t0 = performance.now();
  const fd = new FormData();
  fd.append('file', f); fd.append('dpi', $('#dpi').value); fd.append('tile', $('#tile').value);
  try {
    const r = await fetch('/api/upscale', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const size = r.headers.get('X-Image-Size');
    const url = URL.createObjectURL(await r.blob());
    const name = f.name.replace(/\.[^.]+$/, '') + '_x4.png';
    status.className = 'status';
    status.innerHTML = `<span class="muted">${size} · ${((performance.now() - t0) / 1000).toFixed(1)}s</span> <a class="btn" download="${name}" href="${url}">Tải về</a>`;
  } catch (e) {
    status.className = 'status err';
    status.textContent = e instanceof TypeError
      ? 'Lỗi: không kết nối được server. Cửa sổ đen run.bat phải luôn mở; hãy chạy lại run.bat rồi tải lại trang.'
      : 'Lỗi: ' + e.message;
  }
}
</script>
</body>
</html>
